<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KirdarBarcelona - Share Your Stories</title>
  <meta name="description" content="A community platform to share your thoughts, stories, and ideas with the world." />


  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6F53P44YLV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-6F53P44YLV');
  </script>

</head>

<body>

  <style>
    .ad-sidebar-left {
      position: fixed;
      top: 100px;
      left: 10px;
      z-index: 90;
    }

    .ad-sidebar-right {
      position: fixed;
      top: 100px;
      right: 10px;
      z-index: 90;
    }

    /* Hide ads on screens smaller than 1450px to prevent overlap with main content */
    @media (max-width: 1450px) {

      .ad-sidebar-left,
      .ad-sidebar-right {
        display: none;
      }
    }
  </style>

  <!-- Ad Container - Fixed Left Side -->
  <div id="ad-sidebar-left" class="ad-sidebar-left"></div>

  <!-- Ad Container - Fixed Right Side -->
  <div id="ad-sidebar-right" class="ad-sidebar-right"></div>

  <script>
    // Only load sidebar ads on large screens
    if (window.innerWidth > 1450) {
      function injectAd(containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;

        const script1 = document.createElement('script');
        script1.type = 'text/javascript';
        script1.text = `
          atOptions = {
            'key': 'f77ac3df558d4425a21c8ffdf5b86384',
            'format': 'iframe',
            'height': 600,
            'width': 160,
            'params': {}
          };
        `;
        container.appendChild(script1);

        const script2 = document.createElement('script');
        script2.type = 'text/javascript';
        script2.src = '//www.highperformanceformat.com/f77ac3df558d4425a21c8ffdf5b86384/invoke.js';
        container.appendChild(script2);
      }

      injectAd('ad-sidebar-left');
      injectAd('ad-sidebar-right');
    }
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
